<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenGateway — review vector draft</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #181D23; color: #F4F7FA; font: 16px system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #AEBBC8; margin: 0 0 24px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  section { min-width: 0; }
  h2 { font-size: 18px; }
  .large { padding: 84px; border: 1px solid #344250; }
  .large img { display: block; width: 100%; height: auto; }
  .small { display: flex; align-items: center; gap: 40px; padding: 24px; margin-top: 16px; border: 1px solid #344250; }
  .small img { height: 24px; width: auto; }
  .small .header { height: 64px; }
</style>
<h1>TokenGateway — draft vector, belum approved</h1>
<p>Kiri: crop JPEG pemilik, hanya whitespace dibuang. Kanan: shape manual, warna dinormalisasi. Ruang bebas besar ≥25% tinggi mark. Ukuran kecil: tinggi 24px dan 64px.</p>
<main>
  <section>
    <h2>Referensi JPEG</h2>
    <div class="large"><img src="tokengateway-reference-crop.png" alt="Mark dari JPEG pemilik"></div>
    <div class="small"><img src="tokengateway-reference-crop.png" alt="Referensi tinggi 24px"><img class="header" src="tokengateway-reference-crop.png" alt="Referensi tinggi 64px"></div>
  </section>
  <section>
    <h2>Draft SVG — #0066FF / #16DDE2 / #293744</h2>
    <div class="large"><img src="../../public/brand/tokengateway-mark.svg" alt="Draft vector manual"></div>
    <div class="small"><img src="../../public/brand/tokengateway-mark.svg" alt="Draft tinggi 24px"><img class="header" src="../../public/brand/tokengateway-mark.svg" alt="Draft tinggi 64px"></div>
  </section>
</main>
</html>
